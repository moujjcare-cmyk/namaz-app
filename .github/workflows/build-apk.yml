name: Build Native Masjid Clock APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-Inject Smart Filter Script into index.html
        run: |
          cat << 'EOF' >> index.html
          <script>
          (function() {
            function syncSmartAlarms() {
              if (!window.AndroidSilentBridge || !window.AndroidSilentBridge.scheduleSmartAlarms) return;
              try {
                const isFriday = (new Date().getDay() === 5);
                
                // ہر نماز کی مخصوص لاجک (pre: جماعت سے کتنے منٹ پہلے، dur: کل کتنے منٹ سائلنٹ رہے)
                const rules = {
                  'فجر': { pre: 15, dur: 40 },  // 15 منٹ پہلے + 25 منٹ بعد = 40 منٹ
                  'ظہر': isFriday ? { pre: 20, dur: 45 } : { pre: 10, dur: 30 }, // جمعہ کو خاص ٹائمنگ
                  'جمعہ': { pre: 20, dur: 45 }, // 20 منٹ پہلے + 25 منٹ بعد = 45 منٹ
                  'عصر': { pre: 10, dur: 25 },  // 10 منٹ پہلے + 15 منٹ بعد = 25 منٹ
                  'مغرب': { pre: 4, dur: 19 },  // 4 منٹ پہلے + 15 منٹ بعد = 19 منٹ
                  'عشاء': { pre: 10, dur: 35 }  // 10 منٹ پہلے + 25 منٹ بعد = 35 منٹ
                };
                
                let foundAlarms = {};
                const singleTimeRegex = /\b(0?[1-9]|1[0-2]):([0-5][0-9])\s*(AM|PM)\b/i;
                const allTimeRegex = /\b(0?[1-9]|1[0-2]):([0-5][0-9])\s*(AM|PM)\b/gi;
                
                const containers = document.querySelectorAll('div, tr, li');
                containers.forEach(el => {
                  const text = (el.innerText || "").trim();
                  // صرف نماز والے کارڈز کو چیک کرنا جہاں اول وقت بھی لکھا ہو تاکہ فالتو ڈبے فلٹر ہو جائیں
                  if (text.length > 15 && text.length < 250 && text.includes('اول وقت')) {
                    Object.keys(rules).forEach(prayer => {
                      if (text.includes(prayer) && !foundAlarms[prayer]) {
                        let jamaatMatch = null;
                        
                        // 1. سب سے پہلے جماعت والے بٹن کو تلاش کرنا (جس میں اول وقت یا اذان نہیں لکھا ہوتا)
                        const subEls = el.querySelectorAll('button, span, div');
                        subEls.forEach(sub => {
                          const sTxt = (sub.innerText || "").trim();
                          if (!jamaatMatch && sTxt.length <= 15 && !sTxt.includes('اول') && !sTxt.includes('اذان')) {
                            const m = sTxt.match(singleTimeRegex);
                            if (m) jamaatMatch = m;
                          }
                        });
                        
                        // 2. بیک اپ طریقہ: اگر بٹن الگ نہ ملے تو کارڈ کا سب سے پہلا وقت اٹھانا (جو جماعت کا ہوتا ہے)
                        if (!jamaatMatch) {
                          const allMatches = [...text.matchAll(allTimeRegex)];
                          if (allMatches.length > 0) {
                            jamaatMatch = allMatches[0];
                          }
                        }

                        if (jamaatMatch) {
                          let hr = parseInt(jamaatMatch[1], 10);
                          const min = parseInt(jamaatMatch[2], 10);
                          const ampm = jamaatMatch[3].toUpperCase();
                          if (ampm === 'PM' && hr < 12) hr += 12;
                          if (ampm === 'AM' && hr === 12) hr = 0;
                          
                          foundAlarms[prayer] = {
                            h: hr,
                            m: min,
                            pre: rules[prayer].pre,
                            dur: rules[prayer].dur
                          };
                        }
                      }
                    });
                  }
                });

                const timesArray = Object.values(foundAlarms);
                if (timesArray.length > 0) {
                  const payload = JSON.stringify(timesArray);
                  if (window._lastSmartPayload !== payload) {
                    window._lastSmartPayload = payload;
                    window.AndroidSilentBridge.scheduleSmartAlarms(payload);
                  }
                }
              } catch (e) {
                console.error("Smart Alarm Sync Error:", e);
              }
            }
            
            setInterval(syncSmartAlarms, 4000);
            window.addEventListener('load', () => setTimeout(syncSmartAlarms, 2000));
            document.addEventListener('click', () => setTimeout(syncSmartAlarms, 1000));
          })();
          </script>
          EOF

      - name: Install Dependencies & Build Web Folder
        run: |
          npm install
          npm run build

      - name: Add Capacitor Android Platform
        run: npx cap add android

      - name: Generate Mosque App Icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          curl -sL "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f54c.png" -o mosque_raw.png
          convert -size 512x512 xc:"#0b1015" \( mosque_raw.png -resize 340x340 \) -gravity center -composite icon_512.png
          RES="android/app/src/main/res"
          rm -rf $RES/mipmap-anydpi-v26
          for dir in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            folder="${dir%%:*}"
            size="${dir##*:}"
            convert icon_512.png -resize ${size}x${size} $RES/mipmap-$folder/ic_launcher.png
            convert icon_512.png -resize ${size}x${size} $RES/mipmap-$folder/ic_launcher_round.png
            convert icon_512.png -resize ${size}x${size} $RES/mipmap-$folder/ic_launcher_foreground.png
          done

      - name: Configure Native Permissions in Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.WAKE_LOCK" \/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" \/>\n    <application/' "$MANIFEST"
          sed -i 's/<\/application>/<receiver android:name=".PrayerAlarmReceiver" android:enabled="true" android:exported="false" \/>\n    <\/application>/' "$MANIFEST"

      - name: Create Smart Alarm Receiver & Bridge
        run: |
          PKG_DIR="android/app/src/main/java/com/dreamavenue/mosqueclock"
          mkdir -p "$PKG_DIR"
          
          # 1. PrayerAlarmReceiver.java
          cat << 'EOF' > "$PKG_DIR/PrayerAlarmReceiver.java"
          package com.dreamavenue.mosqueclock;

          import android.app.AlarmManager;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import java.util.Calendar;

          public class PrayerAlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M) return;
                  NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null || !nm.isNotificationPolicyAccessGranted()) return;

                  String action = intent.getStringExtra("ACTION_TYPE");
                  if ("START_SILENT".equals(action)) {
                      nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_NONE);
                      int durationMins = intent.getIntExtra("DURATION_MINS", 20);
                      
                      AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                      Intent restoreIntent = new Intent(context, PrayerAlarmReceiver.class);
                      restoreIntent.putExtra("ACTION_TYPE", "STOP_SILENT");
                      PendingIntent pi = PendingIntent.getBroadcast(
                          context, 9999, restoreIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );
                      long restoreTime = System.currentTimeMillis() + (Math.max(1, durationMins) * 60L * 1000L);
                      if (am != null) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, restoreTime, pi);
                          } else {
                              am.setExact(AlarmManager.RTC_WAKEUP, restoreTime, pi);
                          }
                      }

                      int hour = intent.getIntExtra("HOUR", -1);
                      int minute = intent.getIntExtra("MINUTE", -1);
                      int reqCode = intent.getIntExtra("REQ_CODE", 2000);
                      if (hour >= 0 && minute >= 0 && am != null) {
                          Calendar nextCal = Calendar.getInstance();
                          nextCal.add(Calendar.DAY_OF_YEAR, 1);
                          nextCal.set(Calendar.HOUR_OF_DAY, hour);
                          nextCal.set(Calendar.MINUTE, minute);
                          nextCal.set(Calendar.SECOND, 0);
                          nextCal.set(Calendar.MILLISECOND, 0);

                          Intent nextIntent = new Intent(context, PrayerAlarmReceiver.class);
                          nextIntent.putExtra("ACTION_TYPE", "START_SILENT");
                          nextIntent.putExtra("DURATION_MINS", durationMins);
                          nextIntent.putExtra("HOUR", hour);
                          nextIntent.putExtra("MINUTE", minute);
                          nextIntent.putExtra("REQ_CODE", reqCode);

                          PendingIntent nextPi = PendingIntent.getBroadcast(
                              context, reqCode, nextIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                          );
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, nextCal.getTimeInMillis(), nextPi);
                          }
                      }
                  } else if ("STOP_SILENT".equals(action)) {
                      nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL);
                  }
              }
          }
          EOF

          # 2. MainActivity.java (تمام بٹنز اور نئے سمارٹ فلٹر کے ساتھ مکمل)
          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package com.dreamavenue.mosqueclock;

          import android.app.AlarmManager;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;
          import java.util.Calendar;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  this.bridge.getWebView().addJavascriptInterface(new SilentBridge(this), "AndroidSilentBridge");
              }

              public class SilentBridge {
                  Context mContext;
                  SilentBridge(Context c) { mContext = c; }

                  // پرمیشن بٹن کے لیے
                  @JavascriptInterface
                  public void requestPermissions() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          NotificationManager nm = (NotificationManager) mContext.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null && !nm.isNotificationPolicyAccessGranted()) {
                              Intent intent = new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS);
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              mContext.startActivity(intent);
                          } else {
                              new Handler(Looper.getMainLooper()).post(() ->
                                  Toast.makeText(mContext, "DND Permission Already Granted!", Toast.LENGTH_SHORT).show()
                              );
                          }
                      }
                  }

                  // سائلنٹ الرٹ ٹیسٹ بٹن کے لیے
                  @JavascriptInterface
                  public void setSilentMode(boolean enable, int durationMins, String prayerLabel) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          NotificationManager nm = (NotificationManager) mContext.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null && nm.isNotificationPolicyAccessGranted()) {
                              AlarmManager am = (AlarmManager) mContext.getSystemService(Context.ALARM_SERVICE);
                              Intent restoreIntent = new Intent(mContext, PrayerAlarmReceiver.class);
                              restoreIntent.putExtra("ACTION_TYPE", "STOP_SILENT");
                              PendingIntent pi = PendingIntent.getBroadcast(
                                  mContext, 9999, restoreIntent,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                              );
                              if (enable) {
                                  nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_NONE);
                                  long restoreTime = System.currentTimeMillis() + (Math.max(1, durationMins) * 60L * 1000L);
                                  if (am != null) {
                                      am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, restoreTime, pi);
                                  }
                              } else {
                                  if (am != null) am.cancel(pi);
                                  nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL);
                              }
                          }
                      }
                  }

                  // پرانے فنکشن کو خالی رکھا گیا ہے تاکہ ایپ کا پرانا کوڈ کریش نہ ہو
                  @JavascriptInterface
                  public void scheduleDailyAlarms(String csvTimes, int durationMins) {
                      // Handled by scheduleSmartAlarms
                  }

                  // نیا سمارٹ فلٹر شیڈولر
                  @JavascriptInterface
                  public void scheduleSmartAlarms(String jsonString) {
                      try {
                          AlarmManager am = (AlarmManager) mContext.getSystemService(Context.ALARM_SERVICE);
                          if (am == null || jsonString == null || jsonString.isEmpty()) return;

                          int baseCode = 2000;
                          for (int i = 0; i < 15; i++) {
                              Intent cancelIntent = new Intent(mContext, PrayerAlarmReceiver.class);
                              PendingIntent cancelPi = PendingIntent.getBroadcast(
                                  mContext, baseCode + i, cancelIntent,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                              );
                              am.cancel(cancelPi);
                          }

                          JSONArray arr = new JSONArray(jsonString);
                          for (int i = 0; i < arr.length(); i++) {
                              JSONObject obj = arr.getJSONObject(i);
                              int hr = obj.getInt("h");
                              int min = obj.getInt("m");
                              int pre = obj.getInt("pre");
                              int dur = obj.getInt("dur");

                              Calendar cal = Calendar.getInstance();
                              cal.set(Calendar.HOUR_OF_DAY, hr);
                              cal.set(Calendar.MINUTE, min);
                              cal.set(Calendar.SECOND, 0);
                              cal.set(Calendar.MILLISECOND, 0);

                              // جماعت کے وقت سے مقررہ منٹ (مثلاً 10، 15 یا 4 منٹ) پیچھے لانا
                              cal.add(Calendar.MINUTE, -pre);

                              if (cal.getTimeInMillis() <= System.currentTimeMillis()) {
                                  cal.add(Calendar.DAY_OF_YEAR, 1);
                              }

                              Intent alarmIntent = new Intent(mContext, PrayerAlarmReceiver.class);
                              alarmIntent.putExtra("ACTION_TYPE", "START_SILENT");
                              alarmIntent.putExtra("DURATION_MINS", dur);
                              alarmIntent.putExtra("HOUR", cal.get(Calendar.HOUR_OF_DAY));
                              alarmIntent.putExtra("MINUTE", cal.get(Calendar.MINUTE));
                              alarmIntent.putExtra("REQ_CODE", baseCode + i);

                              PendingIntent pi = PendingIntent.getBroadcast(
                                  mContext, baseCode + i, alarmIntent,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                              );
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.getTimeInMillis(), pi);
                              } else {
                                  am.setExact(AlarmManager.RTC_WAKEUP, cal.getTimeInMillis(), pi);
                              }
                          }
                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF

      - name: Sync Capacitor & Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready Native APK
        uses: actions/upload-artifact@v4
        with:
          name: Masjid-Clock-Native-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
