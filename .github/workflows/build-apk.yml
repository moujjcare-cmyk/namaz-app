name: Build Native Masjid Clock APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies & Build Web Folder
        run: |
          npm install
          npm run build

      - name: Add Capacitor Android Platform
        run: npx cap add android

      - name: Generate Mosque App Icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          curl -sL "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f54c.png" -o mosque_raw.png
          
          # 512x512 کسٹم ایپ آئیکن کی تیاری
          convert -size 512x512 xc:"#0b1015" \
            \( mosque_raw.png -resize 360x360 \) -gravity center -composite \
            icon_512.png
          
          RES="android/app/src/main/res"
          # ایپ آئیکنز کو اینڈرائیڈ کے تمام سائزز میں ڈالنا
          for dir in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            folder="${dir%%:*}"
            size="${dir##*:}"
            convert icon_512.png -resize ${size}x${size} $RES/mipmap-$folder/ic_launcher.png
            convert icon_512.png -resize ${size}x${size} $RES/mipmap-$folder/ic_launcher_round.png
          done

      - name: Configure Background Service Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # فار گراؤنڈ سروس کی پرمیشنز کا اندراج
          sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" \/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.WAKE_LOCK" \/>\n    <application/' "$MANIFEST"
          
          # سروس کو مینی فیسٹ میں رجسٹر کرنا
          sed -i 's/<\/application>/<service android:name=".MosqueBackgroundService" android:foregroundServiceType="specialUse" android:exported="false" \/>\n    <\/application>/' "$MANIFEST"

      - name: Create Background Service Java Files
        run: |
          PKG_DIR="android/app/src/main/java/com/dreamavenue/mosqueclock"
          
          # 1. بیک گراؤنڈ سروس جاوا فائل
          cat << 'EOF' > "$PKG_DIR/MosqueBackgroundService.java"
          package com.dreamavenue.mosqueclock;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import androidx.core.app.NotificationCompat;

          public class MosqueBackgroundService extends Service {
              private static final String CHANNEL_ID = "masjid_clock_bg_channel";

              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();
                  Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                          .setContentTitle("مسجد کلاک سروس فعال ہے")
                          .setContentText("نماز کے اوقات کی خودکار نگرانی جاری ہے")
                          .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                          .setPriority(NotificationCompat.PRIORITY_LOW)
                          .setOngoing(true)
                          .build();
                  startForeground(101, notification);
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                              CHANNEL_ID,
                              "Masjid Clock Background Monitor",
                              NotificationManager.IMPORTANCE_LOW
                      );
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) {
                          manager.createNotificationChannel(channel);
                      }
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  return START_STICKY;
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          # 2. مین ایکٹیویٹی اور سائلنٹ بریج
          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package com.dreamavenue.mosqueclock;

          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private Handler dndHandler = new Handler(Looper.getMainLooper());
              private Runnable restoreRunnable;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  // ایپ سوائپ کرنے کے بعد بھی چلتی رہے گی
                  Intent serviceIntent = new Intent(this, MosqueBackgroundService.class);
                  ContextCompat.startForegroundService(this, serviceIntent);

                  this.bridge.getWebView().addJavascriptInterface(new SilentBridge(this), "AndroidSilentBridge");
              }

              public class SilentBridge {
                  Context mContext;
                  SilentBridge(Context c) { mContext = c; }

                  @JavascriptInterface
                  public void requestPermissions() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          NotificationManager nm = (NotificationManager) mContext.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null && !nm.isNotificationPolicyAccessGranted()) {
                              Intent intent = new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS);
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              mContext.startActivity(intent);
                          } else {
                              new Handler(Looper.getMainLooper()).post(() ->
                                  Toast.makeText(mContext, "DND Permission Already Granted!", Toast.LENGTH_SHORT).show()
                              );
                          }
                      }
                  }

                  @JavascriptInterface
                  public void setSilentMode(boolean enable, int durationMins, String prayerLabel) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          NotificationManager nm = (NotificationManager) mContext.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null && nm.isNotificationPolicyAccessGranted()) {
                              if (restoreRunnable != null) {
                                  dndHandler.removeCallbacks(restoreRunnable);
                              }
                              if (enable) {
                                  nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_NONE);
                                  long delayMillis = Math.max(1, durationMins) * 60L * 1000L;
                                  restoreRunnable = () -> {
                                      if (nm.isNotificationPolicyAccessGranted()) {
                                          nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL);
                                      }
                                  };
                                  dndHandler.postDelayed(restoreRunnable, delayMillis);
                              } else {
                                  nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL);
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Sync Capacitor & Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready Native APK
        uses: actions/upload-artifact@v4
        with:
          name: Masjid-Clock-Native-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
