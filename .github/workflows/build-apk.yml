name: Build Native Masjid Clock APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies & Build Web Folder
        run: |
          npm install
          npm run build

      - name: Add Capacitor Android Platform
        run: npx cap add android

      - name: Inject DND Permissions into AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" \/>\n    <uses-permission android:name="android.permission.VIBRATE" \/>\n    <uses-permission android:name="android.permission.WAKE_LOCK" \/>\n    <application/' "$MANIFEST"

      - name: Inject AndroidSilentBridge into MainActivity.java
        run: |
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java")
          cat << 'EOF' > "$MAIN_ACT"
          package com.dreamavenue.mosqueclock;

          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private Handler dndHandler = new Handler(Looper.getMainLooper());
              private Runnable restoreRunnable;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  this.bridge.getWebView().addJavascriptInterface(new SilentBridge(this), "AndroidSilentBridge");
              }

              public class SilentBridge {
                  Context mContext;
                  SilentBridge(Context c) { mContext = c; }

                  @JavascriptInterface
                  public void requestPermissions() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          NotificationManager nm = (NotificationManager) mContext.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null && !nm.isNotificationPolicyAccessGranted()) {
                              Intent intent = new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS);
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              mContext.startActivity(intent);
                          } else {
                              new Handler(Looper.getMainLooper()).post(() ->
                                  Toast.makeText(mContext, "DND Permission Already Granted!", Toast.LENGTH_SHORT).show()
                              );
                          }
                      }
                  }

                  @JavascriptInterface
                  public void setSilentMode(boolean enable, int durationMins, String prayerLabel) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          NotificationManager nm = (NotificationManager) mContext.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null && nm.isNotificationPolicyAccessGranted()) {
                              if (restoreRunnable != null) {
                                  dndHandler.removeCallbacks(restoreRunnable);
                              }
                              if (enable) {
                                  nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_NONE);
                                  long delayMillis = Math.max(1, durationMins) * 60L * 1000L;
                                  restoreRunnable = () -> {
                                      if (nm.isNotificationPolicyAccessGranted()) {
                                          nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL);
                                      }
                                  };
                                  dndHandler.postDelayed(restoreRunnable, delayMillis);
                              } else {
                                  nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL);
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Sync Capacitor & Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready Native APK
        uses: actions/upload-artifact@v4
        with:
          name: Masjid-Clock-Native-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
