name: Build Native Masjid Clock APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies & Build Web Folder
        run: |
          npm install
          npm run build

      - name: Add Capacitor Android Platform
        run: npx cap add android

      - name: Generate Mosque App Icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          curl -sL "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f54c.png" -o mosque_raw.png
          convert -size 512x512 xc:"#0A0A0E" \( mosque_raw.png -resize 340x340 \) -gravity center -composite icon_512.png
          RES="android/app/src/main/res"
          rm -rf $RES/mipmap-anydpi-v26
          for dir in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            folder="${dir%%:*}"
            size="${dir##*:}"
            convert icon_512.png -resize ${size}x${size} $RES/mipmap-$folder/ic_launcher.png
            convert icon_512.png -resize ${size}x${size} $RES/mipmap-$folder/ic_launcher_round.png
            convert icon_512.png -resize ${size}x${size} $RES/mipmap-$folder/ic_launcher_foreground.png
          done

      - name: Configure Native Permissions in Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" \/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>\n    <uses-permission android:name="android.permission.WAKE_LOCK" \/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" \/>\n    <application/' "$MANIFEST"
          sed -i 's/<\/application>/<receiver android:name=".PrayerAlarmReceiver" android:enabled="true" android:exported="false" \/>\n    <\/application>/' "$MANIFEST"

      - name: Create Unified Alarm Receiver & 3-Permission Bridge
        run: |
          PKG_DIR="android/app/src/main/java/com/dreamavenue/mosqueclock"
          mkdir -p "$PKG_DIR"

          cat << 'EOF' > "$PKG_DIR/PrayerAlarmReceiver.java"
          package com.dreamavenue.mosqueclock;

          import android.app.AlarmManager;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;
          import java.util.Calendar;

          public class PrayerAlarmReceiver extends BroadcastReceiver {
              private static final String CHANNEL_ID = "masjid_mini_timer_channel";

              @Override
              public void onReceive(Context context, Intent intent) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M) return;
                  NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;

                  String action = intent.getStringExtra("ACTION_TYPE");
                  if ("SHOW_MINI_TIMER".equals(action)) {
                      String prayerName = intent.getStringExtra("PRAYER_NAME");
                      int leadMins = intent.getIntExtra("LEAD_MINS", 30);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationChannel ch = new NotificationChannel(
                              CHANNEL_ID, "Masjid Clock Mini Timer", NotificationManager.IMPORTANCE_LOW
                          );
                          ch.setDescription("Pre-Jamaat lock screen countdown notification");
                          ch.setSound(null, null);
                          ch.enableVibration(false);
                          nm.createNotificationChannel(ch);
                      }
                      Intent openIntent = new Intent(context, MainActivity.class);
                      PendingIntent contentPi = PendingIntent.getActivity(
                          context, 0, openIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );
                      NotificationCompat.Builder nb = new NotificationCompat.Builder(context, CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                          .setContentTitle("🕌 Masjid Clock — جماعت کا وقت قریب ہے")
                          .setContentText((prayerName != null ? prayerName : "نماز") + " کی جماعت میں " + leadMins + " منٹ باقی ہیں")
                          .setPriority(NotificationCompat.PRIORITY_LOW)
                          .setOngoing(false)
                          .setAutoCancel(true)
                          .setTimeoutAfter(leadMins * 60L * 1000L)
                          .setContentIntent(contentPi);
                      nm.notify(7777, nb.build());
                      return;
                  }

                  if (!nm.isNotificationPolicyAccessGranted()) return;

                  if ("START_SILENT".equals(action)) {
                      nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_NONE);
                      int durationMins = intent.getIntExtra("DURATION_MINS", 25);

                      AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                      Intent restoreIntent = new Intent(context, PrayerAlarmReceiver.class);
                      restoreIntent.putExtra("ACTION_TYPE", "STOP_SILENT");
                      PendingIntent pi = PendingIntent.getBroadcast(
                          context, 9999, restoreIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );
                      long restoreTime = System.currentTimeMillis() + (Math.max(1, durationMins) * 60L * 1000L);
                      if (am != null) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, restoreTime, pi);
                          } else {
                              am.setExact(AlarmManager.RTC_WAKEUP, restoreTime, pi);
                          }
                      }

                      int hour = intent.getIntExtra("HOUR", -1);
                      int minute = intent.getIntExtra("MINUTE", -1);
                      int reqCode = intent.getIntExtra("REQ_CODE", 2000);
                      if (hour >= 0 && minute >= 0 && am != null) {
                          Calendar nextCal = Calendar.getInstance();
                          nextCal.add(Calendar.DAY_OF_YEAR, 1);
                          nextCal.set(Calendar.HOUR_OF_DAY, hour);
                          nextCal.set(Calendar.MINUTE, minute);
                          nextCal.set(Calendar.SECOND, 0);
                          nextCal.set(Calendar.MILLISECOND, 0);

                          Intent nextIntent = new Intent(context, PrayerAlarmReceiver.class);
                          nextIntent.putExtra("ACTION_TYPE", "START_SILENT");
                          nextIntent.putExtra("DURATION_MINS", durationMins);
                          nextIntent.putExtra("HOUR", hour);
                          nextIntent.putExtra("MINUTE", minute);
                          nextIntent.putExtra("REQ_CODE", reqCode);

                          PendingIntent nextPi = PendingIntent.getBroadcast(
                              context, reqCode, nextIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                          );
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, nextCal.getTimeInMillis(), nextPi);
                          }
                      }
                  } else if ("STOP_SILENT".equals(action)) {
                      nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL);
                  }
              }
          }
          EOF

          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package com.dreamavenue.mosqueclock;

          import android.app.AlarmManager;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;
          import java.util.Calendar;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  UnifiedBridge bridgeObj = new UnifiedBridge(this);
                  this.bridge.getWebView().addJavascriptInterface(bridgeObj, "AndroidSilentBridge");
                  this.bridge.getWebView().addJavascriptInterface(bridgeObj, "AndroidDndBridge");
              }

              public class UnifiedBridge {
                  Context mContext;
                  UnifiedBridge(Context c) { mContext = c; }

                  private void showToast(String msg) {
                      new Handler(Looper.getMainLooper()).post(() ->
                          Toast.makeText(mContext, msg, Toast.LENGTH_SHORT).show()
                      );
                  }

                  @JavascriptInterface
                  public void openDndSettings() {
                      requestPermissions();
                  }

                  @JavascriptInterface
                  public void requestPermissions() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          NotificationManager nm = (NotificationManager) mContext.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null && !nm.isNotificationPolicyAccessGranted()) {
                              Intent intent = new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS);
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              mContext.startActivity(intent);
                          } else {
                              showToast("✅ 1. ڈو ناٹ ڈسٹرب (DND) پرمیشن پہلے سے آن ہے!");
                          }
                      }
                  }

                  @JavascriptInterface
                  public void requestIgnoreBatteryOptimizations() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          try {
                              PowerManager pm = (PowerManager) mContext.getSystemService(Context.POWER_SERVICE);
                              String pkg = mContext.getPackageName();
                              if (pm != null && !pm.isIgnoringBatteryOptimizations(pkg)) {
                                  Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                                  intent.setData(Uri.parse("package:" + pkg));
                                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  mContext.startActivity(intent);
                              } else {
                                  showToast("✅ 2. بیٹری سیور استثنیٰ (Don't Optimise) پہلے سے آن ہے!");
                              }
                          } catch (Exception e) {
                              try {
                                  Intent fallback = new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS);
                                  fallback.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  mContext.startActivity(fallback);
                              } catch (Exception ignored) {}
                          }
                      }
                  }

                  @JavascriptInterface
                  public void openExactAlarmSettings() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          try {
                              AlarmManager am = (AlarmManager) mContext.getSystemService(Context.ALARM_SERVICE);
                              if (am != null && !am.canScheduleExactAlarms()) {
                                  Intent intent = new Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM);
                                  intent.setData(Uri.parse("package:" + mContext.getPackageName()));
                                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  mContext.startActivity(intent);
                              } else {
                                  showToast("✅ 3. بیک گراؤنڈ ایگزیکٹ الارم پرمیشن پہلے سے آن ہے!");
                              }
                          } catch (Exception e) {
                              showToast("✅ 3. بیک گراؤنڈ الارم پرمیشن فعال ہے!");
                          }
                      } else {
                          showToast("✅ 3. بیک گراؤنڈ الارم پرمیشن اس اینڈرائیڈ ورژن پر خودکار آن ہے!");
                      }
                  }

                  @JavascriptInterface
                  public String getPermissionsStatus() {
                      boolean dndOk = true;
                      boolean batOk = true;
                      boolean alarmOk = true;
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              NotificationManager nm = (NotificationManager) mContext.getSystemService(Context.NOTIFICATION_SERVICE);
                              dndOk = (nm != null && nm.isNotificationPolicyAccessGranted());
                              PowerManager pm = (PowerManager) mContext.getSystemService(Context.POWER_SERVICE);
                              batOk = (pm != null && pm.isIgnoringBatteryOptimizations(mContext.getPackageName()));
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                              AlarmManager am = (AlarmManager) mContext.getSystemService(Context.ALARM_SERVICE);
                              alarmOk = (am != null && am.canScheduleExactAlarms());
                          }
                      } catch (Exception ignored) {}
                      return "{\"dnd\":" + dndOk + ",\"battery\":" + batOk + ",\"exactAlarm\":" + alarmOk + "}";
                  }

                  @JavascriptInterface
                  public void moveAppToBackground() {
                      runOnUiThread(() -> moveTaskToBack(true));
                  }

                  @JavascriptInterface
                  public void setSilentModeNow(boolean enable) {
                      setSilentMode(enable, 20, "");
                  }

                  @JavascriptInterface
                  public void setSilentMode(boolean enable, int durationMins, String prayerLabel) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          NotificationManager nm = (NotificationManager) mContext.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null && nm.isNotificationPolicyAccessGranted()) {
                              AlarmManager am = (AlarmManager) mContext.getSystemService(Context.ALARM_SERVICE);
                              Intent restoreIntent = new Intent(mContext, PrayerAlarmReceiver.class);
                              restoreIntent.putExtra("ACTION_TYPE", "STOP_SILENT");
                              PendingIntent pi = PendingIntent.getBroadcast(
                                  mContext, 9999, restoreIntent,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                              );
                              if (enable) {
                                  nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_NONE);
                                  int actualMins = (prayerLabel != null && (prayerLabel.contains("ٹیسٹ") || prayerLabel.toLowerCase().contains("test"))) ? 2 : Math.max(1, durationMins);
                                  long restoreTime = System.currentTimeMillis() + (actualMins * 60L * 1000L);
                                  if (am != null) {
                                      am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, restoreTime, pi);
                                  }
                                  showToast("🔕 سائلنٹ موڈ فعال (" + actualMins + " منٹ)");
                              } else {
                                  if (am != null) am.cancel(pi);
                                  nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL);
                                  showToast("🔔 فون نارمل موڈ پر بحال ہو گیا");
                              }
                          } else {
                              requestPermissions();
                          }
                      }
                  }

                  @JavascriptInterface
                  public void scheduleDailyDndWindows(String jsonArray) {
                      try {
                          AlarmManager am = (AlarmManager) mContext.getSystemService(Context.ALARM_SERVICE);
                          if (am == null || jsonArray == null) return;

                          int baseCode = 2000;
                          for (int i = 0; i < 15; i++) {
                              Intent cancelIntent = new Intent(mContext, PrayerAlarmReceiver.class);
                              PendingIntent cancelPi = PendingIntent.getBroadcast(
                                  mContext, baseCode + i, cancelIntent,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                              );
                              am.cancel(cancelPi);
                          }

                          JSONArray arr = new JSONArray(jsonArray);
                          for (int i = 0; i < arr.length(); i++) {
                              JSONObject w = arr.getJSONObject(i);
                              int sh = w.getInt("startHour");
                              int sm = w.getInt("startMinute");
                              int eh = w.getInt("endHour");
                              int em = w.getInt("endMinute");

                              int startTotal = sh * 60 + sm;
                              int endTotal = eh * 60 + em;
                              int dur = endTotal - startTotal;
                              if (dur <= 0) dur += 1440;

                              Calendar cal = Calendar.getInstance();
                              cal.set(Calendar.HOUR_OF_DAY, sh);
                              cal.set(Calendar.MINUTE, sm);
                              cal.set(Calendar.SECOND, 0);
                              cal.set(Calendar.MILLISECOND, 0);

                              if (cal.getTimeInMillis() <= System.currentTimeMillis()) {
                                  cal.add(Calendar.DAY_OF_YEAR, 1);
                              }

                              Intent alarmIntent = new Intent(mContext, PrayerAlarmReceiver.class);
                              alarmIntent.putExtra("ACTION_TYPE", "START_SILENT");
                              alarmIntent.putExtra("DURATION_MINS", dur);
                              alarmIntent.putExtra("HOUR", sh);
                              alarmIntent.putExtra("MINUTE", sm);
                              alarmIntent.putExtra("REQ_CODE", baseCode + i);

                              PendingIntent pi = PendingIntent.getBroadcast(
                                  mContext, baseCode + i, alarmIntent,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                              );
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.getTimeInMillis(), pi);
                              } else {
                                  am.setExact(AlarmManager.RTC_WAKEUP, cal.getTimeInMillis(), pi);
                              }
                          }
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public void scheduleMiniTimerNotifications(String jsonPayload) {
                      try {
                          AlarmManager am = (AlarmManager) mContext.getSystemService(Context.ALARM_SERVICE);
                          if (am == null || jsonPayload == null) return;

                          int mtBase = 3000;
                          for (int i = 0; i < 10; i++) {
                              Intent cInt = new Intent(mContext, PrayerAlarmReceiver.class);
                              PendingIntent cPi = PendingIntent.getBroadcast(
                                  mContext, mtBase + i, cInt,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                              );
                              am.cancel(cPi);
                          }

                          JSONObject root = new JSONObject(jsonPayload);
                          if (!root.optBoolean("enabled", true)) return;
                          int leadMins = root.optInt("leadMins", 30);
                          JSONArray arr = root.optJSONArray("windows");
                          if (arr == null) return;

                          for (int i = 0; i < arr.length(); i++) {
                              JSONObject w = arr.getJSONObject(i);
                              int sh = w.getInt("startHour");
                              int sm = w.getInt("startMinute");
                              String pKey = w.optString("prayer", "نماز");

                              Calendar cal = Calendar.getInstance();
                              cal.set(Calendar.HOUR_OF_DAY, sh);
                              cal.set(Calendar.MINUTE, sm);
                              cal.set(Calendar.SECOND, 0);
                              cal.set(Calendar.MILLISECOND, 0);
                              cal.add(Calendar.MINUTE, -Math.max(5, leadMins - 10));

                              if (cal.getTimeInMillis() <= System.currentTimeMillis()) {
                                  cal.add(Calendar.DAY_OF_YEAR, 1);
                              }

                              Intent mtIntent = new Intent(mContext, PrayerAlarmReceiver.class);
                              mtIntent.putExtra("ACTION_TYPE", "SHOW_MINI_TIMER");
                              mtIntent.putExtra("PRAYER_NAME", pKey);
                              mtIntent.putExtra("LEAD_MINS", leadMins);

                              PendingIntent mtPi = PendingIntent.getBroadcast(
                                  mContext, mtBase + i, mtIntent,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                              );
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.getTimeInMillis(), mtPi);
                              }
                          }
                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF

      - name: Sync Capacitor & Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Masjid-Clock.apk

      - name: Upload Ready Native APK
        uses: actions/upload-artifact@v4
        with:
          name: Masjid-Clock-Native-APK
          path: android/app/build/outputs/apk/debug/Masjid-Clock.apk
