name: Build Native Masjid Clock APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-Inject UI Enhancements & Smart Filter into index.html
        run: |
          cat << 'EOF' >> index.html
          <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
          <script>
          (function() {
            function injectCustomUI() {
              // 1. کلمہ مبارک والے باکس کو اوپر فکس (Sticky) کرنا
              const allDivs = document.querySelectorAll('div');
              for (let i = 0; i < allDivs.length; i++) {
                const d = allDivs[i];
                if (d.dataset.stickySet) continue;
                const txt = d.innerText || "";
                if (txt.includes('بسم') && txt.includes('رسول') && txt.length < 150 && d.children.length <= 4) {
                  d.dataset.stickySet = "true";
                  d.style.position = 'sticky';
                  d.style.top = '0';
                  d.style.zIndex = '9999';
                  d.style.backgroundColor = '#0b1015';
                  d.style.paddingTop = '8px';
                  d.style.paddingBottom = '8px';
                  d.style.borderBottom = '1px solid #fbbf24';
                  d.style.boxShadow = '0 6px 15px rgba(0, 0, 0, 0.8)';
                  break;
                }
              }

              // 2. سیٹنگز میں جماعت سے پہلے اور بعد کے آپشنز اور آئیکن ٹوگل شامل کرنا
              if (!document.getElementById('mouj-pre-select')) {
                const allSelects = document.querySelectorAll('select');
                allSelects.forEach(sel => {
                  if (sel.innerText.includes('20 منٹ') && !document.getElementById('mouj-pre-select')) {
                    if (!sel.innerHTML.includes('45')) {
                      sel.insertAdjacentHTML('beforeend', '<option value="25">25 منٹ (نماز + سنتیں)</option><option value="30">30 منٹ (مکمل اطمینان)</option><option value="45">45 منٹ (جمعہ / طویل دورانیہ)</option>');
                    }

                    const wrapper = document.createElement('div');
                    wrapper.style.marginTop = '12px';
                    wrapper.style.marginBottom = '12px';
                    wrapper.style.textAlign = 'right';
                    wrapper.dir = 'rtl';
                    wrapper.innerHTML = `
                      <label style="display:block; color:#cbd5e1; font-size:13px; margin-bottom:6px;">جماعت سے کتنے منٹ پہلے موبائل سائلنٹ ہو؟</label>
                      <select id="mouj-pre-select" style="width:100%; padding:10px; background:#0f172a; color:#f8fafc; border:1px solid #334155; border-radius:8px; font-family:inherit; font-size:14px; margin-bottom:10px;">
                        <option value="smart">سمارٹ آٹو موڈ (فجر 15m، مغرب 4m، جمعہ 20m، باقی 10m)</option>
                        <option value="10">ہر نماز میں جماعت سے 10 منٹ پہلے</option>
                        <option value="15">ہر نماز میں جماعت سے 15 منٹ پہلے</option>
                        <option value="5">ہر نماز میں جماعت سے 5 منٹ پہلے</option>
                        <option value="20">ہر نماز میں جماعت سے 20 منٹ پہلے</option>
                        <option value="30">اذان کے ساتھ (جماعت سے 30 منٹ قبل)</option>
                      </select>
                      <label style="display:flex; align-items:center; gap:8px; color:#38bdf8; font-size:13px; cursor:pointer; margin-top:6px;">
                        <input type="checkbox" id="mouj-status-icon" style="width:18px; height:18px; accent-color:#0284c7;">
                        <span>اسکرین کے اوپر (Status Bar) میں ایپ چلنے کا آئیکن دکھائیں</span>
                      </label>
                    `;
                    sel.parentNode.insertBefore(wrapper, sel);

                    const preSelect = document.getElementById('mouj-pre-select');
                    const statusToggle = document.getElementById('mouj-status-icon');

                    preSelect.value = localStorage.getItem('mouj_pre_mode') || 'smart';
                    statusToggle.checked = localStorage.getItem('mouj_status_icon') === 'true';

                    preSelect.addEventListener('change', () => {
                      localStorage.setItem('mouj_pre_mode', preSelect.value);
                      window._lastSmartPayload = "";
                      syncSmartAlarms();
                    });

                    statusToggle.addEventListener('change', () => {
                      localStorage.setItem('mouj_status_icon', statusToggle.checked);
                      if (window.AndroidSilentBridge && window.AndroidSilentBridge.toggleStatusIcon) {
                        window.AndroidSilentBridge.toggleStatusIcon(statusToggle.checked);
                      }
                    });
                  }
                });
              }

              // 3. موج ڈیجیٹل کا لوگو اور دعا
              if (!document.getElementById('mouj-branding-footer')) {
                const footer = document.createElement('div');
                footer.id = 'mouj-branding-footer';
                footer.dir = 'rtl';
                footer.style.cssText = 'text-align:center; padding:22px 14px; margin:25px 12px 90px 12px; border:1px solid rgba(251,191,36,0.3); background:linear-gradient(180deg, #091326 0%, #050b14 100%); border-radius:16px; box-shadow:0 8px 20px rgba(0,0,0,0.6);';
                footer.innerHTML = `
                  <div id="mouj-dnd-info" style="color:#10b981; font-size:12px; font-weight:bold; margin-bottom:16px; padding:8px; background:rgba(16,185,129,0.12); border:1px solid rgba(16,185,129,0.3); border-radius:8px; display:none;"></div>
                  
                  <div style="max-width:280px; margin:0 auto 12px auto;">
                    <svg viewBox="0 0 360 155" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
                      <defs>
                        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                          <stop offset="0%" stop-color="#fffbeb" />
                          <stop offset="35%" stop-color="#fbbf24" />
                          <stop offset="70%" stop-color="#d97706" />
                          <stop offset="100%" stop-color="#fef3c7" />
                        </linearGradient>
                        <linearGradient id="waveCyan" x1="0%" y1="0%" x2="100%" y2="0%">
                          <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
                          <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.95" />
                          <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.9" />
                        </linearGradient>
                        <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
                          <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
                        </filter>
                      </defs>

                      <path d="M 35 90 Q 115 55, 195 85 T 315 35 C 335 55, 325 95, 275 105 C 215 115, 135 70, 35 90 Z" fill="url(#waveCyan)" />
                      <path d="M 55 98 Q 135 68, 215 92 T 298 48 C 308 68, 290 98, 245 104 C 185 112, 125 82, 55 98 Z" fill="url(#goldGrad)" opacity="0.85" />
                      
                      <circle cx="305" cy="25" r="3.5" fill="#bae6fd" />
                      <circle cx="322" cy="38" r="2.5" fill="#38bdf8" />
                      <circle cx="288" cy="30" r="2" fill="#fbbf24" />
                      <circle cx="328" cy="55" r="3" fill="#bae6fd" />
                      <circle cx="65" cy="80" r="2" fill="#38bdf8" />

                      <text x="172" y="78" text-anchor="middle" fill="url(#goldGrad)" filter="url(#dropShadow)" style="font-family:'Cinzel Decorative', 'Georgia', serif; font-size:60px; font-weight:900; letter-spacing:2px;">MOUJ</text>

                      <path d="M 35 132 Q 70 124, 100 132" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8" />
                      <path d="M 260 132 Q 290 140, 325 132" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8" />
                      <text x="180" y="138" text-anchor="middle" fill="url(#goldGrad)" filter="url(#dropShadow)" style="font-family:'Cinzel Decorative', 'Georgia', serif; font-size:27px; font-weight:700; letter-spacing:4px;">DIGITAL</text>
                    </svg>
                  </div>

                  <div style="color:#f1f5f9; font-size:14px; margin-top:4px; line-height:1.9; font-weight:500;">
                    یہ کاوش محض اللہ کی رضا اور صدقہ جاریہ کے لیے ہے۔<br>
                    براہِ کرم اپنی دعاؤں میں ہمیں بھی یاد رکھیں۔<br>
                    اللہ پاک ہماری اس کوشش کو دنیا اور آخرت میں ہماری مغفرت کا سبب بنائے، آمین۔<br>
                    <span style="color:#fbbf24; font-weight:bold; display:inline-block; margin-top:8px; font-size:15px;">طالبِ دعا: موج ڈیجیٹل</span>
                  </div>
                `;
                document.body.appendChild(footer);
              }
            }

            function syncSmartAlarms() {
              if (!window.AndroidSilentBridge || !window.AndroidSilentBridge.scheduleSmartAlarms) return;
              try {
                const isFriday = (new Date().getDay() === 5);
                const preMode = localStorage.getItem('mouj_pre_mode') || 'smart';

                let postMins = 20;
                document.querySelectorAll('select').forEach(sel => {
                  if (sel.id !== 'mouj-pre-select' && sel.innerText.includes('منٹ')) {
                    const val = parseInt(sel.value, 10);
                    if (!isNaN(val) && val > 0) postMins = val;
                  }
                });

                const defaultRules = {
                  'فجر': { pre: 15, post: Math.max(postMins, 25) },
                  'ظہر': isFriday ? { pre: 20, post: Math.max(postMins, 25) } : { pre: 10, post: postMins },
                  'جمعہ': { pre: 20, post: Math.max(postMins, 25) },
                  'عصر': { pre: 10, post: 15 },
                  'مغرب': { pre: 4, post: 15 },
                  'عشاء': { pre: 10, post: Math.max(postMins, 25) }
                };

                let foundAlarms = {};
                const singleTimeRegex = /\b(0?[1-9]|1[0-2]):([0-5][0-9])\s*(AM|PM)\b/i;
                const allTimeRegex = /\b(0?[1-9]|1[0-2]):([0-5][0-9])\s*(AM|PM)\b/gi;

                const containers = document.querySelectorAll('div, tr, li');
                containers.forEach(el => {
                  const text = (el.innerText || "").trim();
                  if (text.length > 15 && text.length < 250 && text.includes('اول وقت')) {
                    Object.keys(defaultRules).forEach(prayer => {
                      if (text.includes(prayer) && !foundAlarms[prayer]) {
                        let jamaatMatch = null;
                        const subEls = el.querySelectorAll('button, span, div');
                        subEls.forEach(sub => {
                          const sTxt = (sub.innerText || "").trim();
                          if (!jamaatMatch && sTxt.length <= 15 && !sTxt.includes('اول') && !sTxt.includes('اذان')) {
                            const m = sTxt.match(singleTimeRegex);
                            if (m) jamaatMatch = m;
                          }
                        });

                        if (!jamaatMatch) {
                          const allMatches = [...text.matchAll(allTimeRegex)];
                          if (allMatches.length > 0) jamaatMatch = allMatches[0];
                        }

                        if (jamaatMatch) {
                          let hr = parseInt(jamaatMatch[1], 10);
                          const min = parseInt(jamaatMatch[2], 10);
                          const ampm = jamaatMatch[3].toUpperCase();
                          if (ampm === 'PM' && hr < 12) hr += 12;
                          if (ampm === 'AM' && hr === 12) hr = 0;

                          const preVal = (preMode === 'smart') ? defaultRules[prayer].pre : parseInt(preMode, 10);
                          const postVal = (preMode === 'smart') ? defaultRules[prayer].post : postMins;

                          foundAlarms[prayer] = {
                            h: hr,
                            m: min,
                            pre: preVal,
                            dur: preVal + postVal
                          };
                        }
                      }
                    });
                  }
                });

                const timesArray = Object.values(foundAlarms);
                if (timesArray.length > 0) {
                  let infoDiv = document.getElementById('mouj-dnd-info');
                  if (infoDiv) {
                    let displayTexts = [];
                    Object.keys(foundAlarms).forEach(p => {
                       let th = foundAlarms[p].h;
                       let tm = foundAlarms[p].m;
                       let d = new Date(); d.setHours(th, tm, 0);
                       d.setMinutes(d.getMinutes() - foundAlarms[p].pre);
                       let sh = d.getHours(); let sm = d.getMinutes();
                       let ampm = sh >= 12 ? 'PM' : 'AM';
                       sh = sh % 12; sh = sh ? sh : 12;
                       sm = sm < 10 ? '0'+sm : sm;
                       displayTexts.push(`${p}: ${sh}:${sm} ${ampm}`);
                    });
                    infoDiv.innerHTML = "✅ <b>آٹو سائلنٹ شیڈول فعال ہے:</b><br>" + displayTexts.join(' | ');
                    infoDiv.style.display = 'block';
                  }

                  const payload = JSON.stringify(timesArray);
                  if (window._lastSmartPayload !== payload) {
                    window._lastSmartPayload = payload;
                    window.AndroidSilentBridge.scheduleSmartAlarms(payload);
                  }
                }
              } catch (e) { console.error("Sync Error:", e); }
            }

            setInterval(() => {
              if (!document.hidden) {
                injectCustomUI();
                syncSmartAlarms();
              }
            }, 6000);

            window.addEventListener('load', () => { setTimeout(() => { injectCustomUI(); syncSmartAlarms(); }, 1200); });
            document.addEventListener('click', () => { setTimeout(() => { injectCustomUI(); syncSmartAlarms(); }, 400); });
          })();
          </script>
          EOF

      - name: Install Dependencies & Build Web Folder
        run: |
          npm install
          npm run build

      - name: Add Capacitor Android Platform
        run: npx cap add android

      - name: Generate Mosque App Icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          curl -sL "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f54c.png" -o mosque_raw.png
          convert -size 512x512 xc:"#0b1015" \( mosque_raw.png -resize 340x340 \) -gravity center -composite icon_512.png
          RES="android/app/src/main/res"
          rm -rf $RES/mipmap-anydpi-v26
          for dir in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            folder="${dir%%:*}"
            size="${dir##*:}"
            convert icon_512.png -resize ${size}x${size} $RES/mipmap-$folder/ic_launcher.png
            convert icon_512.png -resize ${size}x${size} $RES/mipmap-$folder/ic_launcher_round.png
            convert icon_512.png -resize ${size}x${size} $RES/mipmap-$folder/ic_launcher_foreground.png
          done

      - name: Configure Native Permissions in Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" \/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.WAKE_LOCK" \/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" \/>\n    <application/' "$MANIFEST"
          sed -i 's/<\/application>/<receiver android:name=".PrayerAlarmReceiver" android:enabled="true" android:exported="false" \/>\n    <\/application>/' "$MANIFEST"

      - name: Create Smart Alarm Receiver & Bridge
        run: |
          PKG_DIR="android/app/src/main/java/com/dreamavenue/mosqueclock"
          mkdir -p "$PKG_DIR"
          
          # 1. PrayerAlarmReceiver.java
          cat << 'EOF' > "$PKG_DIR/PrayerAlarmReceiver.java"
          package com.dreamavenue.mosqueclock;

          import android.app.AlarmManager;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import java.util.Calendar;

          public class PrayerAlarmReceiver extends BroadcastReceiver {
              private void setSafeAlarm(AlarmManager am, long triggerAtMillis, PendingIntent pi) {
                  if (am == null) return;
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAtMillis, pi);
                      } else {
                          am.setExact(AlarmManager.RTC_WAKEUP, triggerAtMillis, pi);
                      }
                  } catch (SecurityException se) {
                      try { am.set(AlarmManager.RTC_WAKEUP, triggerAtMillis, pi); } catch (Exception ignored) {}
                  } catch (Exception ignored) {}
              }

              @Override
              public void onReceive(Context context, Intent intent) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M) return;
                  NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null || !nm.isNotificationPolicyAccessGranted()) return;

                  String action = intent.getStringExtra("ACTION_TYPE");
                  int flags = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;

                  if ("START_SILENT".equals(action)) {
                      try { nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_NONE); } catch (Exception ignored) {}
                      int durationMins = intent.getIntExtra("DURATION_MINS", 25);
                      
                      AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                      Intent restoreIntent = new Intent(context, PrayerAlarmReceiver.class);
                      restoreIntent.putExtra("ACTION_TYPE", "STOP_SILENT");
                      PendingIntent pi = PendingIntent.getBroadcast(context, 9999, restoreIntent, flags);
                      long restoreTime = System.currentTimeMillis() + (Math.max(1, durationMins) * 60L * 1000L);
                      setSafeAlarm(am, restoreTime, pi);

                      int hour = intent.getIntExtra("HOUR", -1);
                      int minute = intent.getIntExtra("MINUTE", -1);
                      int reqCode = intent.getIntExtra("REQ_CODE", 2000);
                      if (hour >= 0 && minute >= 0 && am != null) {
                          Calendar nextCal = Calendar.getInstance();
                          nextCal.add(Calendar.DAY_OF_YEAR, 1);
                          nextCal.set(Calendar.HOUR_OF_DAY, hour);
                          nextCal.set(Calendar.MINUTE, minute);
                          nextCal.set(Calendar.SECOND, 0);
                          nextCal.set(Calendar.MILLISECOND, 0);

                          Intent nextIntent = new Intent(context, PrayerAlarmReceiver.class);
                          nextIntent.putExtra("ACTION_TYPE", "START_SILENT");
                          nextIntent.putExtra("DURATION_MINS", durationMins);
                          nextIntent.putExtra("HOUR", hour);
                          nextIntent.putExtra("MINUTE", minute);
                          nextIntent.putExtra("REQ_CODE", reqCode);

                          PendingIntent nextPi = PendingIntent.getBroadcast(context, reqCode, nextIntent, flags);
                          setSafeAlarm(am, nextCal.getTimeInMillis(), nextPi);
                      }
                  } else if ("STOP_SILENT".equals(action)) {
                      try { nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL); } catch (Exception ignored) {}
                  }
              }
          }
          EOF

          # 2. MainActivity.java
          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package com.dreamavenue.mosqueclock;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;
          import java.util.Calendar;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  this.bridge.getWebView().addJavascriptInterface(new SilentBridge(this), "AndroidSilentBridge");
              }

              public class SilentBridge {
                  Context mContext;
                  SilentBridge(Context c) { mContext = c; }

                  private void scheduleSafe(AlarmManager am, long timeMillis, PendingIntent pi) {
                      if (am == null) return;
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, timeMillis, pi);
                          } else {
                              am.setExact(AlarmManager.RTC_WAKEUP, timeMillis, pi);
                          }
                      } catch (SecurityException se) {
                          try { am.set(AlarmManager.RTC_WAKEUP, timeMillis, pi); } catch (Exception ignored) {}
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public void requestPermissions() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          NotificationManager nm = (NotificationManager) mContext.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null && !nm.isNotificationPolicyAccessGranted()) {
                              Intent intent = new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS);
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              mContext.startActivity(intent);
                          } else {
                              new Handler(Looper.getMainLooper()).post(() ->
                                  Toast.makeText(mContext, "DND Permission Already Granted!", Toast.LENGTH_SHORT).show()
                              );
                          }
                      }
                  }

                  @JavascriptInterface
                  public void toggleStatusIcon(boolean show) {
                      try {
                          NotificationManager nm = (NotificationManager) mContext.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm == null) return;
                          String chanId = "masjid_active_indicator";
                          if (show) {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  NotificationChannel ch = new NotificationChannel(chanId, "Masjid Clock Active", NotificationManager.IMPORTANCE_LOW);
                                  ch.setShowBadge(false);
                                  nm.createNotificationChannel(ch);
                              }
                              Intent openIntent = new Intent(mContext, MainActivity.class);
                              PendingIntent pi = PendingIntent.getActivity(mContext, 0, openIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                              Notification.Builder b = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O ?
                                  new Notification.Builder(mContext, chanId) : new Notification.Builder(mContext);
                              b.setContentTitle("مسجد کلاک آٹو سائلنٹ فعال ہے")
                               .setContentText("نماز کے اوقات میں فون خودکار سائلنٹ ہو جائے گا • MOUJ Digital")
                               .setSmallIcon(mContext.getApplicationInfo().icon)
                               .setContentIntent(pi)
                               .setOngoing(true);
                              nm.notify(7788, b.build());
                          } else {
                              nm.cancel(7788);
                          }
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public void setSilentMode(boolean enable, int durationMins, String prayerLabel) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          NotificationManager nm = (NotificationManager) mContext.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null && nm.isNotificationPolicyAccessGranted()) {
                              AlarmManager am = (AlarmManager) mContext.getSystemService(Context.ALARM_SERVICE);
                              Intent restoreIntent = new Intent(mContext, PrayerAlarmReceiver.class);
                              restoreIntent.putExtra("ACTION_TYPE", "STOP_SILENT");
                              PendingIntent pi = PendingIntent.getBroadcast(
                                  mContext, 9999, restoreIntent,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                              );
                              if (enable) {
                                  try { nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_NONE); } catch (Exception ignored) {}
                                  long restoreTime = System.currentTimeMillis() + (Math.max(1, durationMins) * 60L * 1000L);
                                  scheduleSafe(am, restoreTime, pi);
                              } else {
                                  if (am != null) am.cancel(pi);
                                  try { nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL); } catch (Exception ignored) {}
                              }
                          }
                      }
                  }

                  @JavascriptInterface
                  public void scheduleDailyAlarms(String csvTimes, int durationMins) { }

                  @JavascriptInterface
                  public void scheduleSmartAlarms(String jsonString) {
                      try {
                          AlarmManager am = (AlarmManager) mContext.getSystemService(Context.ALARM_SERVICE);
                          if (am == null || jsonString == null || jsonString.isEmpty()) return;

                          int baseCode = 2000;
                          int flags = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;
                          for (int i = 0; i < 15; i++) {
                              Intent cancelIntent = new Intent(mContext, PrayerAlarmReceiver.class);
                              PendingIntent cancelPi = PendingIntent.getBroadcast(mContext, baseCode + i, cancelIntent, flags);
                              am.cancel(cancelPi);
                          }

                          JSONArray arr = new JSONArray(jsonString);
                          for (int i = 0; i < arr.length(); i++) {
                              JSONObject obj = arr.getJSONObject(i);
                              int hr = obj.getInt("h");
                              int min = obj.getInt("m");
                              int pre = obj.getInt("pre");
                              int dur = obj.getInt("dur");

                              Calendar cal = Calendar.getInstance();
                              cal.set(Calendar.HOUR_OF_DAY, hr);
                              cal.set(Calendar.MINUTE, min);
                              cal.set(Calendar.SECOND, 0);
                              cal.set(Calendar.MILLISECOND, 0);

                              cal.add(Calendar.MINUTE, -pre);

                              if (cal.getTimeInMillis() <= System.currentTimeMillis()) {
                                  cal.add(Calendar.DAY_OF_YEAR, 1);
                              }

                              Intent alarmIntent = new Intent(mContext, PrayerAlarmReceiver.class);
                              alarmIntent.putExtra("ACTION_TYPE", "START_SILENT");
                              alarmIntent.putExtra("DURATION_MINS", dur);
                              alarmIntent.putExtra("HOUR", cal.get(Calendar.HOUR_OF_DAY));
                              alarmIntent.putExtra("MINUTE", cal.get(Calendar.MINUTE));
                              alarmIntent.putExtra("REQ_CODE", baseCode + i);

                              PendingIntent pi = PendingIntent.getBroadcast(mContext, baseCode + i, alarmIntent, flags);
                              scheduleSafe(am, cal.getTimeInMillis(), pi);
                          }
                      } catch (Exception ignored) {}
                  }
              }
          }
